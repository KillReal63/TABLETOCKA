server {
    listen 80;
    server_name 144.31.166.231;
    location /.well-known/acme-challenge/ { root /var/www/vovremya; }
    location / { return 301 https://144.31.166.231$request_uri; }
}
server {
    listen 443 ssl;
    server_name 144.31.166.231;
    ssl_certificate /etc/letsencrypt/live/vovremya/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vovremya/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/vovremya;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    location = /vovrema { return 308 /vovrema/; }
    location = / { return 308 /vovrema/; }
    location = /vovrema/manifest.webmanifest {
        alias /var/www/vovremya/manifest.webmanifest;
        types { application/manifest+json webmanifest; }
    }
    # Compatibility for already-installed PWA and existing push subscriptions.
    location = /manifest.webmanifest {
        alias /var/www/vovremya/manifest.webmanifest;
        types { application/manifest+json webmanifest; }
    }
    location = /sw.js { alias /var/www/vovremya/sw.js; }
    location /vovrema/api/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # Temporary compatibility for tabs opened before migration.
    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location /vovrema/ { alias /var/www/vovremya/; }
    location ~ ^/(index\.html|app\.js|auth\.js|push\.js|themes\.js|focus-ui\.js|focus\.css|product\.css|style\.css|icon-(180|192|512)\.png)$ {
        return 308 /vovrema$uri;
    }
    location / { return 404; }
}
